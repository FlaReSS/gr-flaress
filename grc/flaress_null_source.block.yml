id: flaress_null_source
label: Null Source
category: '[flaress]'
flags: [ python, cpp ]

parameters:
-   id: type
    label: Output Type
    dtype: enum
    options: [f64, s64]
    option_labels: [Float64, Int64]
    option_attributes:
        size: [gr.sizeof_double, 8]
    hide: part
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: num_outputs
    label: Num Outputs
    dtype: int
    default: '1'
    hide: part
-   id: bus_structure_source
    label: Bus Connections
    dtype: raw
    default: '[[0,],]'
    hide: part

outputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
    multiplicity: ${ num_outputs }

templates:
    imports: from gnuradio import flaress
    make: flaress.null_source(${type.size}*${vlen})

cpp_templates:
    includes: ['#include <gnuradio/flaress/null_source.h>']
    declarations: 'flaress::null_source::sptr ${id};'
    make: 'this->${id} = flaress::null_source::make(${type.size}*${vlen});'

file_format: 1
