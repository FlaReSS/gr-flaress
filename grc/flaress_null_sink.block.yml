id: flaress_null_sink
label: Null Sink
category: '[flaress]'
flags: [ python, cpp ]

parameters:
-   id: type
    label: Input Type
    dtype: enum
    options: [f64, s64]
    option_labels: [Float64, Int64]
    option_attributes:
        size: [gr.sizeof_double, 8]
    hide: part
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: num_inputs
    label: Num Inputs
    dtype: int
    default: '1'
    hide: part
-   id: bus_structure_sink
    label: Bus Connections
    dtype: raw
    default: '[[0,],]'
    hide: part

inputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
    multiplicity: ${ num_inputs }

asserts:
- ${ num_inputs >= 1 }
- ${ vlen > 0 }

templates:
    imports: from gnuradio import flaress
    make: flaress.null_sink(${type.size}*${vlen})

cpp_templates:
    includes: ['#include <gnuradio/flaress/null_sink.h>']
    declarations: 'flaress::null_sink::sptr ${id};'
    make: 'this->${id} = flaress::null_sink::make(${type.size}*${vlen});'

file_format: 1
