id: flaress_add
label: Add
flags: [ python, cpp ]
category: '[flaress]'

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [f64, s64]
    option_labels: [Float64, Int64]
    option_attributes:
        fcn: [double, int64]
    hide: part
-   id: num_inputs
    label: Num Inputs
    dtype: int
    default: '2'
    hide: part
-   id: vlen
    label: Vec Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
    multiplicity: ${ num_inputs }

outputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ num_inputs > 1 }
- ${ vlen > 0 }

templates:
    imports: from gnuradio import flaress
    make: flaress.add_${type.fcn}(${vlen})

cpp_templates:
    includes: ['#include <gnuradio/flaress/add.h>']
    declarations: 'flaress::add_${type.fcn}::sptr ${id};'
    make: 'this->${id} = flaress::add_${type.fcn}::make(${vlen});'

file_format: 1
